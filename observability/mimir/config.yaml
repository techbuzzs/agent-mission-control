multitenancy_enabled: false
target: all
server:
  http_listen_port: 9009
ingester:
  ring:
    replication_factor: 1
blocks_storage:
  backend: filesystem
  bucket_store:
    sync_dir: /data/tsdb-sync
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb
compactor:
  data_dir: /data/compactor
ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules
alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/alertmanager
